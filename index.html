<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TIMEPLUS OS — Sistema Operativo Personal de Organización con IA</title>
  <meta name="description" content="Dile a TimePlus qué necesitas y la IA organiza el resto. Agenda, reuniones, salud, fitness, proyectos y movilidad.">
  
  <!-- Zero-Cache Headers -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <!-- Native Autonomous Stylesheet (Zero CDN Dependencies) -->
  <link rel="stylesheet" href="css/timeplus-os.css?v=20260907_rebuild">
</head>
<body>

  <!-- Top Navigation Header -->
  <header class="top-header">
    <div style="display: flex; align-items: center; gap: 1rem;">
      <button id="mobile-menu-toggle" style="background: none; border: none; font-size: 1.5rem; cursor: pointer; display: none;" class="mobile-only">
        ☰
      </button>
      <div class="brand-badge" onclick="window.timeplusRouter.navigate('hoy')">
        <div class="brand-icon">T+</div>
        <div class="brand-text">
          <h1>TIMEPLUS <span style="font-size: 0.65rem; background: #EFF6FF; color: #2563EB; border: 1px solid #BFDBFE; padding: 0.1rem 0.4rem; border-radius: 9999px;">OS</span></h1>
          <p>Sistema Operativo Personal con IA</p>
        </div>
      </div>
    </div>

    <div style="display: flex; align-items: center; gap: 0.75rem;">
      <button class="btn-secondary" onclick="window.timeplusRouter.navigate('admin')">
        👑 SuperAdmin
      </button>
      <button class="btn-primary" onclick="window.timeplusAI.toggleVoice()">
        🎙️ Hablar con IA
      </button>
    </div>
  </header>

  <!-- Main Application Layout (Sidebar + Dynamic View Content) -->
  <div class="app-container">
    
    <!-- Sidebar Navigation (Matching 30-Point System Vision) -->
    <aside id="app-sidebar" class="app-sidebar">
      <div class="nav-section-title">Centro de Control</div>
      <button class="nav-item active" data-route="hoy" onclick="window.timeplusRouter.navigate('hoy')">
        <span class="icon">🏠</span>
        <span>HOY (En Vivo)</span>
        <span class="badge" style="background: #EFF6FF; color: #2563EB;">Activo</span>
      </button>
      <button class="nav-item" data-route="agenda" onclick="window.timeplusRouter.navigate('agenda')">
        <span class="icon">📅</span>
        <span>Agenda & Categorías</span>
      </button>

      <div class="nav-section-title" style="margin-top: 0.75rem;">Vida & Salud</div>
      <button class="nav-item" data-route="salud" onclick="window.timeplusRouter.navigate('salud')">
        <span class="icon">💊</span>
        <span>Salud & Medicamentos</span>
        <span class="badge" style="background: #FEFCE8; color: #A16207;">Toma</span>
      </button>
      <button class="nav-item" data-route="fitness" onclick="window.timeplusRouter.navigate('fitness')">
        <span class="icon">🏋️</span>
        <span>Fitness & Gimnasio</span>
      </button>
      <button class="nav-item" data-route="citas" onclick="window.timeplusRouter.navigate('citas')">
        <span class="icon">🩺</span>
        <span>Citas Universales</span>
      </button>

      <div class="nav-section-title" style="margin-top: 0.75rem;">Trabajo & Relaciones</div>
      <button class="nav-item" data-route="reuniones" onclick="window.timeplusRouter.navigate('reuniones')">
        <span class="icon">💻</span>
        <span>Reuniones & Salida</span>
      </button>
      <button class="nav-item" data-route="proyectos" onclick="window.timeplusRouter.navigate('proyectos')">
        <span class="icon">💼</span>
        <span>Proyectos & Tareas</span>
      </button>
      <button class="nav-item" data-route="contactos" onclick="window.timeplusRouter.navigate('contactos')">
        <span class="icon">👥</span>
        <span>Personas & Contactos</span>
      </button>
      <button class="nav-item" data-route="lugares" onclick="window.timeplusRouter.navigate('lugares')">
        <span class="icon">📍</span>
        <span>Sedes & Movilidad</span>
      </button>
      <button class="nav-item" data-route="viajes" onclick="window.timeplusRouter.navigate('viajes')">
        <span class="icon">✈️</span>
        <span>Viajes (Travel)</span>
      </button>

      <div class="nav-section-title" style="margin-top: 0.75rem;">Inteligencia</div>
      <button class="nav-item" data-route="inbox" onclick="window.timeplusRouter.navigate('inbox')">
        <span class="icon">📥</span>
        <span>Bandeja de Entrada IA</span>
      </button>
      <button class="nav-item" data-route="estadisticas" onclick="window.timeplusRouter.navigate('estadisticas')">
        <span class="icon">📊</span>
        <span>Estadísticas & BI</span>
      </button>
      <button class="nav-item" data-route="admin" onclick="window.timeplusRouter.navigate('admin')">
        <span class="icon">👑</span>
        <span>Panel SuperAdmin</span>
      </button>
    </aside>

    <!-- Dynamic Main Content View -->
    <main id="main-content-view" class="main-content">
      <!-- Dynamically filled by app.js router -->
    </main>

  </div>

  <!-- Toast Notification Container -->
  <div id="toast-container" class="toast-container"></div>

  <!-- Mobile CSS helper -->
  <style>
    @media (max-width: 1024px) {
      .mobile-only { display: block !important; }
    }
  </style>

  <!-- Supabase CDN Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- Application Modules in Dependency Order -->
  <script src="js/config.js?v=20260907_rebuild"></script>
  <script src="js/supabase-client.js?v=20260907_rebuild"></script>
  <script src="js/store.js?v=20260907_rebuild"></script>
  <script src="js/ai-engine.js?v=20260907_rebuild"></script>
  <script src="js/router.js?v=20260907_rebuild"></script>
  <script src="js/app.js?v=20260907_rebuild"></script>

</body>
</html>
