<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="512" height="512" rx="110" fill="#0B0F19"/>
  
  <!-- Outer Glow Ring -->
  <circle cx="256" cy="256" r="170" fill="none" stroke="url(#ring)" stroke-width="24" stroke-dasharray="800" stroke-dashoffset="120" stroke-linecap="round"/>
  
  <!-- Central Circle -->
  <circle cx="256" cy="256" r="120" fill="url(#grad)"/>
  
  <!-- Plus Symbol -->
  <path d="M256 186 V326 M186 256 H326" stroke="#FFFFFF" stroke-width="32" stroke-linecap="round"/>
  
  <!-- Clock Dot Indicator -->
  <circle cx="360" cy="180" r="16" fill="#38BDF8"/>
</svg>
